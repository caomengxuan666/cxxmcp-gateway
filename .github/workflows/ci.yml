name: ci

on:
  pull_request:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  gateway:
    name: gateway-${{ matrix.os }}-${{ matrix.shared }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shared: static
            build_shared_libs: OFF
          - os: ubuntu-latest
            shared: shared
            build_shared_libs: ON
          - os: windows-latest
            shared: static
            build_shared_libs: OFF

    env:
      CXXMCP_REF: fix/http-pending-request-session-scope

    steps:
      - name: Checkout gateway
        uses: actions/checkout@v4
        with:
          path: cxxmcp-gateway

      - name: Checkout cxxmcp SDK
        uses: actions/checkout@v4
        with:
          repository: caomengxuan666/cxxmcp
          ref: ${{ env.CXXMCP_REF }}
          submodules: recursive
          path: cxxmcp

      - name: Setup MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Install Ninja on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja --no-progress
          }

      - name: Configure SDK
        run: >
          cmake -S cxxmcp -B build-sdk -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX="${{ runner.temp }}/cxxmcp-install"
          -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          -DCXXMCP_SDK_CXX_STANDARD=23
          -DCXXMCP_BUILD_SDK=ON
          -DCXXMCP_BUILD_CLIENT=ON
          -DCXXMCP_BUILD_SERVER=ON
          -DCXXMCP_BUILD_EXAMPLES=OFF
          -DCXXMCP_BUILD_TESTS=OFF
          -DCXXMCP_BUILD_BENCHMARKS=OFF
          -DCXXMCP_ENABLE_HTTP=ON

      - name: Build SDK
        run: cmake --build build-sdk --parallel

      - name: Install SDK
        run: cmake --install build-sdk

      - name: Configure gateway
        run: >
          cmake -S cxxmcp-gateway -B build-gateway -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=${{ matrix.build_shared_libs }}
          -Dcxxmcp_DIR="${{ runner.temp }}/cxxmcp-install/lib/cmake/cxxmcp"

      - name: Build gateway
        run: cmake --build build-gateway --parallel

      - name: Test gateway
        run: ctest --test-dir build-gateway --output-on-failure --timeout 120
